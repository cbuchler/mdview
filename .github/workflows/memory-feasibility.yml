name: Memory feasibility
on:
  pull_request:
    paths:
      - '.github/workflows/memory-feasibility.yml'
      - 'test/fixtures/memory/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: cc -Wall -Wextra test/fixtures/memory/macos-limit.c -o /tmp/mdview-memory-probe
      - run: cc -Wall -Wextra -dynamiclib test/fixtures/memory/deny-process.c -o /tmp/mdview-deny-process.dylib
      - name: Record bounded native memory-limit probes
        run: |
          python3 - <<'PY'
          import subprocess, shutil, os
          for mode in [['allocate'], ['relative-as'], ['spawn'], ['spawn', 'exec'], ['spawn', 'fork'], ['spawn', 'respawn'], ['spawn', 'raise-spawn']]:
              result = subprocess.run(['/tmp/mdview-memory-probe', *mode], capture_output=True, text=True, timeout=10)
              print(mode, 'exit=', result.returncode, result.stdout, result.stderr, flush=True)
          code = "const retained=[]; for(let i=0;i<192;i++){const b=new Uint8Array(1024*1024); for(let j=0;j<b.length;j+=4096)b[j]=1; retained.push(b); if((i+1)%32===0)console.log('touched_mb='+ (i+1))}"
          for runtime in ['node', 'bun']:
              result = subprocess.run(['/tmp/mdview-memory-probe', 'spawn', 'command', shutil.which(runtime), '-e', code], capture_output=True, text=True, timeout=10)
              print(runtime, 'exit=', result.returncode, result.stdout, result.stderr, flush=True)
          restricted = {**os.environ, 'MDVIEW_PROBE_PRELOAD': '/tmp/mdview-deny-process.dylib'}
          for mode in ['exec', 'fork', 'respawn', 'raise-spawn']:
              result = subprocess.run(['/tmp/mdview-memory-probe', 'spawn', mode], env=restricted, capture_output=True, text=True, timeout=10)
              print('restricted', mode, result.returncode, result.stdout, result.stderr, flush=True)
          for runtime in ['node', 'bun']:
              guarded = "try { require('node:child_process').execFileSync(process.execPath,['-e','console.log(1)']); console.log('ESCAPED') } catch(e){console.log('spawn_denied='+e.code)};" + code
              result = subprocess.run(['/tmp/mdview-memory-probe', 'spawn', 'command', shutil.which(runtime), '-e', guarded], env=restricted, capture_output=True, text=True, timeout=10)
              print('restricted', runtime, result.returncode, result.stdout, result.stderr, flush=True)
          PY
      - run: npm ci
      - run: npm run build && npm run package:binaries
      - name: Compare real renderer output under native memory limits
        run: MDVIEW_BUN="$(command -v bun)" MDVIEW_PROBE_PRELOAD=/tmp/mdview-deny-process.dylib node --import tsx test/fixtures/memory/render-probe.ts

name: Memory feasibility
on:
  pull_request:
    paths:
      - '.github/workflows/memory-feasibility.yml'
      - 'test/fixtures/memory/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cc -Wall -Wextra test/fixtures/memory/macos-limit.c -o /tmp/mdview-memory-probe
      - name: Record bounded native memory-limit probes
        run: |
          python3 - <<'PY'
          import subprocess
          for mode in [['allocate'], ['relative-as'], ['spawn'], ['spawn', 'exec'], ['spawn', 'fork'], ['spawn', 'respawn'], ['spawn', 'raise-spawn']]:
              result = subprocess.run(['/tmp/mdview-memory-probe', *mode], capture_output=True, text=True, timeout=10)
              print(mode, 'exit=', result.returncode, result.stdout, result.stderr, flush=True)
          PY

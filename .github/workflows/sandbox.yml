name: Parser sandbox
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node dist/main.js --no-history README.md > /dev/null
      - run: bun src/main.ts --no-history README.md > /dev/null
      - run: npm run package:binaries
      - run: release/mdview --no-history README.md > /dev/null
      - name: Run without Node or Bun on PATH
        shell: bash
        run: |
          tools=$(mktemp -d)
          trap 'rm -rf "$tools"' EXIT
          if [ "$RUNNER_OS" = Linux ]; then
            ln -s "$(command -v bwrap)" "$tools/bwrap"
            ln -s "$(command -v systemd-run)" "$tools/systemd-run"
          else
            for tool in bash env rg; do
              ln -s "$(command -v "$tool")" "$tools/$tool"
            done
          fi
          PATH="$tools" release/mdview --no-history README.md > /dev/null
      - run: npx vitest run --maxWorkers=1 --exclude test/terminal-pty.test.ts
      - name: Check real terminal and busy-worker shutdown
        if: runner.os == 'Linux'
        run: python3 test/fixtures/terminal-pty.py "$PWD" "$(command -v node)" "$PWD/release/mdview"
      - name: Report macOS sandbox denials
        if: failure() && runner.os == 'macOS'
        run: sudo log show --last 3m --style compact --predicate 'process == "sandboxd"' | tail -60
